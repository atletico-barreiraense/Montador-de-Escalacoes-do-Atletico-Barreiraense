<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montador de escalações</title>
<meta name="theme-color" content="#2e6b46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--ink:#14211a;--panel:#fff;--line:#cdd6cf;--mut:#5b6b61;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1613;--ink:#e6ece8;--panel:#17211c;--line:#2b3a32;--mut:#93a499}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1613;--ink:#e6ece8;--panel:#17211c;--line:#2b3a32;--mut:#93a499}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
.app{max-width:1040px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.app{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}.stick{position:sticky;top:16px}}
.pitch{position:relative;aspect-ratio:68/100;border-radius:10px;border:2px solid #1f4a30;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#2e6b46}
.fieldbg,.fieldbg svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crestw{position:absolute;left:50%;top:50%;width:24%;transform:translate(-50%,-50%);opacity:.28;pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);width:16%;min-width:46px;max-width:70px;text-align:center;cursor:grab;touch-action:none;outline:none;transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1)}
.tok.drag{cursor:grabbing;z-index:5;transition:none}
.shirt{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.nm{margin:-2px auto 0;font:600 11px/1.15 Barlow,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85);max-width:80px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.rl{position:absolute;top:-4px;right:-8px;background:#14211a;color:#fff;font:700 10px/1 Barlow,sans-serif;padding:3px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.7)}
.tok.sel .shirt{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.tok:focus-visible .shirt{filter:drop-shadow(0 0 3px #ffd84d) drop-shadow(0 0 3px #ffd84d)}
.pitch.swap .tok .shirt{animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{to{filter:drop-shadow(0 0 4px #ffd84d) drop-shadow(0 0 4px #ffd84d)}}
@media (prefers-reduced-motion:reduce){.tok{transition:none}.pitch.swap .tok .shirt{animation:none;filter:drop-shadow(0 0 4px #ffd84d)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:18px}
h1{margin:0;font:700 34px/1 "Barlow Condensed",Barlow,sans-serif}
h2{margin:0 0 6px;font:700 19px/1.2 "Barlow Condensed",Barlow,sans-serif}
label{display:grid;gap:4px;font-weight:600;font-size:14px;color:var(--mut)}
input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
.cols3{align-items:end;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.chips,.acts{display:flex;flex-wrap:wrap;gap:6px}
button{font:600 14px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button.pri{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2f8f5b;outline-offset:1px}
.pat{display:grid;justify-items:center;gap:2px;padding:6px 8px;min-width:64px;font-size:13px}
.pat svg{width:34px;height:34px}
.crestp{width:48px;height:48px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:3px}
.hint{margin:0;color:var(--mut);font-size:14px}
.ed{display:grid;grid-template-columns:64px 1fr 96px;gap:10px}
.bn{display:grid;grid-template-columns:52px 1fr auto auto;gap:6px;margin-bottom:6px;align-items:center}
.cu{display:grid;grid-template-columns:1fr 130px;gap:10px;margin-top:10px}
textarea{width:100%;font:14px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
</style>
</head>
<body>
<main class="app">
  <div class="stick">
    <div class="pitch" id="pitch">
      <div class="fieldbg" id="fieldbg"></div>
      <img class="crestw" id="crestW" alt="" hidden>
    </div>
    <div class="acts" style="margin-top:8px;align-items:center"><button id="undo" disabled>Desfazer</button><button id="redo" disabled>Refazer</button></div>
    <p class="hint" style="margin-top:8px">Arraste os jogadores para mover. Toque para editar nome, número e função.</p>
  </div>
  <section class="panel">
    <h1>Montador de escalações</h1>
    <label>Nome do time<input type="text" id="team" maxlength="30"></label>
    <div>
      <h2>Uniforme</h2>
      <div class="chips" id="pats"></div>
      <div class="cols3">
        <label>Principal<input type="color" id="color"></label>
        <label>Secundária<input type="color" id="c2"></label>
        <label>Goleiro<input type="color" id="gk"></label>
      </div>
    </div>
    <div>
      <h2>Escudo</h2>
      <div class="acts" style="align-items:center">
        <img class="crestp" id="crestP" alt="Escudo do time" hidden>
        <button id="crestB">Enviar escudo</button><button id="crestX" hidden>Remover escudo</button>
        <input type="file" id="crestF" accept="image/*" hidden>
      </div>
      <p class="hint" id="crestH" style="margin-top:6px">PNG com fundo transparente fica melhor.</p>
    </div>
    <div><h2>Campo</h2><div class="chips" id="fields"></div></div>
    <div>
      <h2>Modalidade</h2><div class="chips" id="modes"></div>
      <div class="cu" id="custom" hidden>
        <label>Nome da modalidade<input type="text" id="mname" maxlength="20"></label>
        <label>Em campo<select id="mn"></select></label>
      </div>
    </div>
    <div><h2>Formação</h2><div class="chips" id="forms"></div></div>
    <div><h2>Jogador selecionado</h2><div id="ed"></div></div>
    <div><h2>Banco de reservas</h2><div id="bench"></div><button id="addb">Adicionar reserva</button></div>
    <div>
      <h2>Compartilhar</h2>
      <div class="acts"><button class="pri" id="png">Baixar imagem</button><button id="link">Copiar link</button><button id="copy">Copiar texto</button><button id="clear">Limpar nomes</button></div>
      <textarea id="txt" rows="9" readonly style="margin-top:10px"></textarea>
    </div>
    <div>
      <h2>Escalações salvas</h2>
      <div class="acts"><select id="sv" style="flex:1;min-width:150px"></select><button id="svSave">Salvar atual</button><button id="svOpen">Abrir</button><button id="svDel">Excluir</button></div>
    </div>
  </section>
</main>
<script>
const MODES={"Futebol 11":11,"Futsal":5,"Fut7":7};
const PRE=["4-4-2","4-3-3","4-2-3-1","3-5-2","3-4-3","5-3-2","4-1-4-1"];
const ROLES=["","GOL","ZAG","LD","LE","VOL","MEI","ME","MD","PE","PD","ATA","FIX","ALA","PIV"];
const PATS={liso:"Lisa",listras:"Listras",horiz:"Faixas",faixa:"Diagonal",metade:"Meio a meio"};
const FIELDS={campo:"Gramado",noite:"Noturno",quadra:"Quadra"};
const $=s=>document.querySelector(s),KEY="escalacao-v2",SAVED="escalacoes-salvas-v2";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRESETS={5:["1-2-1","2-2","3-1","1-3"],7:["3-2-1","2-3-1","3-3","2-2-2","3-1-2","2-1-2-1"]};
function formsFor(n){
  if(n==11)return PRE;if(PRESETS[n])return PRESETS[n];const m=n-1;if(m<1)return[];
  const o=[];if(m<=5)o.push([m]);
  for(let a=1;a<=m;a++)for(let b=1;a+b<=m;b++){const c=m-a-b,r=c?[a,b,c]:[a,b];
    if(Math.max(...r)-Math.min(...r)<=2&&Math.max(...r)<=5)o.push(r);}
  const ideal=m<=3?1:m<=5?2:3,sc=r=>(Math.max(...r)-Math.min(...r))+Math.abs(r.length-ideal)*1.5+(r[0]<r[r.length-1]?.5:0);
  o.sort((x,y)=>sc(x)-sc(y));
  return o.slice(0,8).map(r=>r.join("-"));
}
function layout(f){
  const fs=f.split("-").reduce((a,b)=>a+ +b,0)==4;
  const rows=f.split("-").map(Number),n=rows.length,o=[[50,89,"GOL"]];
  rows.forEach((c,r)=>{const y=n==1?42:70-56*r/(n-1),sp=c<=2?36:c==3?54:c==4?68:76;
    for(let i=0;i<c;i++){
      const edge=c>=3&&(i==0||i==c-1),left=i==0;let ro;
      if(n==1||r==n-1&&n>1)ro=(c==3&&edge)?(left?"PE":"PD"):"ATA";
      if(r==0&&n>1)ro=(c>=4&&edge)?(left?"LE":"LD"):"ZAG";
      if(r>0&&r<n-1)ro=(r==1&&n>=3&&c<=2)?"VOL":(c>=4&&edge?(left?"ME":"MD"):"MEI");
      if(fs){ro=r==n-1&&n>1&&c==1?"PIV":r==0&&c==1?"FIX":"ALA";if(n==1)ro=c==1?"PIV":"ALA";}
      o.push([c==1?50:50-sp/2+sp*i/(c-1),y,ro]);}});
  return o;
}

/* ---------- desenho: camisa e campo (usados na tela e na imagem) ---------- */
function ink(h){const v=parseInt(h.slice(1),16);return(.299*(v>>16)+.587*((v>>8)&255)+.114*(v&255))>150?"#14211a":"#fff";}
const SHIRT="M31 10 L43 5 Q50 13 57 5 L69 10 L95 28 L83 46 L75 40 L75 95 L25 95 L25 40 L17 46 L5 28 Z";
function shirtSVG(base,c2,pat,num,id){
  let deco="";
  if(pat=="listras")for(let x=29;x<76;x+=14)deco+=`<rect x="${x}" y="0" width="7" height="100" fill="${c2}"/>`;
  if(pat=="horiz")for(let y=24;y<100;y+=17)deco+=`<rect x="0" y="${y}" width="100" height="8.5" fill="${c2}"/>`;
  if(pat=="faixa")deco=`<path d="M18 34 L35 15 L84 80 L67 99 Z" fill="${c2}"/>`;
  if(pat=="metade")deco=`<rect x="50" y="0" width="50" height="100" fill="${c2}"/>`;
  let txt="";
  if(num!=null){
    const plain=pat=="liso",fill=plain?ink(base):"#fff";
    txt=`<text x="50" y="68" text-anchor="middle" font-family="'Barlow Condensed',Barlow,'Arial Narrow',sans-serif" font-weight="700" font-size="36" fill="${fill}"${plain?"":` stroke="rgba(0,0,0,.7)" stroke-width="5" paint-order="stroke" stroke-linejoin="round"`}>${esc(num)}</text>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="shirt" aria-hidden="true"><defs><clipPath id="${id}"><path d="${SHIRT}"/></clipPath></defs><g clip-path="url(#${id})"><rect width="100" height="100" fill="${base}"/>${deco}<path d="M5 28 L17 46" stroke="${c2}" stroke-width="7"/><path d="M95 28 L83 46" stroke="${c2}" stroke-width="7"/></g><path d="${SHIRT}" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="2.5" stroke-linejoin="round"/><path d="M43 5 Q50 13 57 5" fill="none" stroke="${c2}" stroke-width="4" stroke-linecap="round"/>${txt}</svg>`;
}
function kitOf(i){return i==0?{b:S.kit.gk,c:ink(S.kit.gk),p:"liso"}:{b:S.color,c:S.kit.c2,p:S.kit.p};}
function fieldSVG(st){
  let bg="",lines="";
  if(st=="quadra"){
    bg=`<rect width="68" height="100" fill="#b5743f"/>`;
    for(let y=0;y<100;y+=2.5)bg+=`<rect y="${y}" width="68" height="1.25" fill="rgba(0,0,0,.05)"/>`;
    bg+=`<path d="M14 3 A15 15 0 0 0 29 18 L39 18 A15 15 0 0 0 54 3 Z" fill="#2c6a9e"/><path d="M14 97 A15 15 0 0 1 29 82 L39 82 A15 15 0 0 1 54 97 Z" fill="#2c6a9e"/><circle cx="34" cy="50" r="8" fill="#2c6a9e"/>`;
    lines=`<rect x="3" y="3" width="62" height="94"/><path d="M3 50h62"/><circle cx="34" cy="50" r="8"/>
      <path d="M14 3 A15 15 0 0 0 29 18 L39 18 A15 15 0 0 0 54 3"/><path d="M14 97 A15 15 0 0 1 29 82 L39 82 A15 15 0 0 1 54 97"/>
      <rect x="29.5" y=".6" width="9" height="2.4"/><rect x="29.5" y="97" width="9" height="2.4"/>
      <g fill="#fff" stroke="none"><circle cx="34" cy="50" r=".7"/><circle cx="34" cy="26" r=".6"/><circle cx="34" cy="74" r=".6"/></g>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 100" preserveAspectRatio="none">${bg}<g fill="none" stroke="#fff" stroke-width=".5">${lines}</g></svg>`;
  }
  const night=st=="noite",a=night?"#1c4630":"#2e6b46",b=night?"#22523a":"#33764d";
  for(let i=0;i<10;i++)bg+=`<rect y="${i*10}" width="68" height="10" fill="${i%2?b:a}"/>`;
  if(night)bg+=`<defs><radialGradient id="vg" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient></defs><rect width="68" height="100" fill="url(#vg)"/>`;
  lines=`<rect x="3" y="3" width="62" height="94"/><path d="M3 50h62"/><circle cx="34" cy="50" r="8.5"/>
    <rect x="13.5" y="3" width="41" height="16"/><rect x="24.5" y="3" width="19" height="6"/>
    <rect x="13.5" y="81" width="41" height="16"/><rect x="24.5" y="91" width="19" height="6"/>
    <path d="M27 19 A8 8 0 0 0 41 19"/><path d="M27 81 A8 8 0 0 1 41 81"/>
    <g fill="rgba(255,255,255,.85)" stroke="none"><circle cx="34" cy="50" r=".6"/><circle cx="34" cy="13" r=".5"/><circle cx="34" cy="87" r=".5"/></g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 100" preserveAspectRatio="none">${bg}<g fill="none" stroke="rgba(255,255,255,${night?".7":".78"})" stroke-width=".45">${lines}</g></svg>`;
}
const BORDER={campo:"#1f4a30",noite:"#10281c",quadra:"#7a4a24"};

/* ---------- estado ---------- */
const blank=n=>({n:String(n),name:""});
const DEFKIT={p:"liso",c2:"#ffffff",gk:"#f2c230"};
let S={team:"Meu time",color:"#c8102e",mode:"Futebol 11",n:11,f:"4-3-3",pl:[],bench:[],pos:[],kit:{...DEFKIT},field:"campo",crest:"",sel:-1,arm:-1};
S.pl=Array.from({length:11},(_,i)=>blank(i+1));
S.bench=Array.from({length:7},(_,i)=>blank(i+12));
S.pos=layout(S.f);
function valid(d){return d&&d.pl&&d.bench&&d.pos&&d.n>=2&&d.n<=11&&d.pl.length==d.n&&d.pos.length==d.n&&typeof d.f=="string"&&d.f.split("-").reduce((a,b)=>a+(+b||0),0)==d.n-1;}
const pick=d=>({team:d.team,color:d.color,mode:d.mode,n:d.n,f:d.f,pl:d.pl,bench:d.bench,pos:d.pos,kit:d.kit,field:d.field,crest:d.crest});
function apply(d){
  Object.assign(S,pick(d),{sel:-1,arm:-1});
  S.kit=Object.assign({...DEFKIT},d.kit||{});if(!PATS[S.kit.p])S.kit.p="liso";
  if(!FIELDS[S.field])S.field=S.mode=="Futsal"?"quadra":"campo";
  if(typeof S.crest!="string"||!S.crest.startsWith("data:image/"))S.crest="";
}
try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(valid(d))apply(d);}catch(e){}
const enc=()=>encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(pick(S))))));
try{if(location.hash.startsWith("#e=")){const d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(3))))));if(valid(d))apply(d);}}catch(e){}
let H=[],hi=-1,lastT=0,lastM=false,restoring=false;
function updUndo(){$("#undo").disabled=hi<=0;$("#redo").disabled=hi>=H.length-1;}
function save(merge){
  const j=JSON.stringify(pick(S));try{localStorage.setItem(KEY,j);}catch(e){}
  if(restoring||H[hi]===j)return;
  const now=Date.now();
  if(merge&&lastM&&hi>0&&now-lastT<700)H[hi]=j;else{H=H.slice(0,hi+1);H.push(j);hi++;if(H.length>100){H.shift();hi--;}}
  lastT=now;lastM=!!merge;updUndo();
}
function syncInputs(){$("#team").value=S.team;$("#color").value=S.color;$("#c2").value=S.kit.c2;$("#gk").value=S.kit.gk;}
function restore(){restoring=true;apply(JSON.parse(H[hi]));syncInputs();refresh();restoring=false;lastT=0;updUndo();}
function undo(){if(hi>0){hi--;restore();}}
function redo(){if(hi<H.length-1){hi++;restore();}}
function nextNum(){const u=new Set([...S.pl,...S.bench].map(p=>p.n));let i=1;while(u.has(String(i)))i++;return String(i);}
function setN(n){
  while(S.pl.length>n)S.bench.unshift(S.pl.pop());
  while(S.pl.length<n)S.pl.push(S.bench.length?S.bench.shift():blank(nextNum()));
  S.n=n;const fs=formsFor(n);if(!fs.includes(S.f))S.f=n==11?"4-3-3":fs[0]||"";
  S.pos=layout(S.f);S.sel=-1;S.arm=-1;
}

/* ---------- tela ---------- */
const pitch=$("#pitch");
function drawPitch(){
  pitch.classList.toggle("swap",S.arm>=0);
  const toks=[...pitch.querySelectorAll(".tok")];
  while(toks.length>S.pl.length)toks.pop().remove();
  while(toks.length<S.pl.length){const t=document.createElement("div");t.className="tok";t.tabIndex=0;t.setAttribute("role","button");t.dataset.i=toks.length;pitch.appendChild(t);toks.push(t);}
  S.pl.forEach((p,i)=>{
    const t=toks[i],r=S.pos[i][2],k=kitOf(i);
    t.classList.toggle("sel",S.sel==i);
    t.setAttribute("aria-label",`Jogador ${p.n} ${p.name} ${r}`.trim());
    t.style.left=S.pos[i][0]+"%";t.style.top=S.pos[i][1]+"%";
    const h=shirtSVG(k.b,k.c,k.p,p.n,"s"+i)+(r?`<span class="rl">${r}</span>`:"")+`<div class="nm">${esc(p.name)}</div>`;
    if(t._h!==h){t.innerHTML=h;t._h=h;}
  });
}
let lastField="";
function drawField(){
  if(lastField!==S.field){$("#fieldbg").innerHTML=fieldSVG(S.field);pitch.style.borderColor=BORDER[S.field];lastField=S.field;}
  $("#fields").innerHTML=Object.entries(FIELDS).map(([k,v])=>`<button data-k="${k}" aria-pressed="${S.field==k}">${v}</button>`).join("");
}
function drawKit(){
  $("#pats").innerHTML=Object.entries(PATS).map(([k,v])=>`<button class="pat" data-p="${k}" aria-pressed="${S.kit.p==k}">${shirtSVG(S.color,S.kit.c2,k,null,"k"+k)}${v}</button>`).join("");
}
function drawCrest(){
  const has=!!S.crest;
  for(const id of ["#crestW","#crestP"]){const im=$(id);if(has){if(im.getAttribute("src")!==S.crest)im.src=S.crest;}else im.removeAttribute("src");im.hidden=!has;}
  $("#crestX").hidden=!has;$("#crestB").textContent=has?"Trocar escudo":"Enviar escudo";
}
function drawModes(){
  const cust=!MODES[S.mode];
  $("#modes").innerHTML=Object.keys(MODES).map(m=>`<button data-m="${m}" aria-pressed="${S.mode==m}">${m}</button>`).join("")+`<button data-m="Outro" aria-pressed="${cust}">Outro</button>`;
  $("#custom").hidden=!cust;$("#mname").value=cust?S.mode:"";
  $("#mn").innerHTML=Array.from({length:10},(_,i)=>`<option value="${i+2}"${S.n==i+2?" selected":""}>${i+2} jogadores</option>`).join("");
  $("#forms").innerHTML=formsFor(S.n).map(f=>`<button data-f="${f}" aria-pressed="${f==S.f}">${f}</button>`).join("");
}
function drawEd(){
  const e=$("#ed");
  if(S.sel<0){e.innerHTML='<p class="hint">Nenhum jogador selecionado.</p>';return;}
  const p=S.pl[S.sel];
  e.innerHTML=`<div class="ed"><label>Número<input type="text" id="en" maxlength="2" inputmode="numeric" value="${esc(p.n)}"></label><label>Nome<input type="text" id="ename" maxlength="22" value="${esc(p.name)}"></label><label>Função<select id="er">${ROLES.map(r=>`<option value="${r}"${S.pos[S.sel][2]==r?" selected":""}>${r||"—"}</option>`).join("")}</select></label></div>`;
  $("#en").oninput=ev=>{S.pl[S.sel].n=ev.target.value;refresh(false,true);};
  $("#ename").oninput=ev=>{S.pl[S.sel].name=ev.target.value;refresh(false,true);};
  $("#er").onchange=ev=>{S.pos[S.sel][2]=ev.target.value;refresh(false,true);};
}
function drawBench(){
  $("#bench").innerHTML=S.bench.map((p,i)=>`<div class="bn" data-i="${i}"><input type="text" class="bnum" maxlength="2" inputmode="numeric" value="${esc(p.n)}" aria-label="Número do reserva ${i+1}"><input type="text" class="bname" maxlength="22" placeholder="Reserva ${i+1}" value="${esc(p.name)}"><button class="swap" aria-pressed="${S.arm==i}">Trocar</button><button class="rm" aria-label="Remover reserva ${i+1}">✕</button></div>`).join("")
    +(S.arm>=0?'<p class="hint">Toque num titular no campo para fazer a troca.</p>':"")
    +(!S.bench.length?'<p class="hint">Sem reservas.</p>':"");
}
function lines(){const l=(p,r)=>`${(p.n||"").padStart(2," ")}  ${p.name||"—"}${r?"  ("+r+")":""}`;
  return `${S.team||"Meu time"} · ${S.mode} ${S.f}\n\n`+S.pl.map((p,i)=>l(p,S.pos[i][2])).join("\n")+(S.bench.length?"\n\nReservas\n"+S.bench.map(p=>l(p)).join("\n"):"");}
function drawTxt(){$("#txt").value=lines();}
function drawSaved(){
  let a=[];try{a=JSON.parse(localStorage.getItem(SAVED)||"[]");}catch(e){}
  $("#sv").innerHTML=a.length?a.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join(""):'<option value="">Nenhuma salva</option>';
}
function refresh(full=true,merge=false){drawPitch();drawTxt();save(merge);if(full){drawField();drawKit();drawCrest();drawModes();drawEd();drawBench();}}

/* ---------- controles ---------- */
syncInputs();
$("#team").oninput=e=>{S.team=e.target.value;drawTxt();save(true);};
$("#color").oninput=e=>{S.color=e.target.value;drawPitch();drawKit();save(true);};
$("#c2").oninput=e=>{S.kit.c2=e.target.value;drawPitch();drawKit();save(true);};
$("#gk").oninput=e=>{S.kit.gk=e.target.value;drawPitch();save(true);};
$("#pats").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.kit.p=b.dataset.p;refresh();};
$("#fields").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.field=b.dataset.k;refresh();};
$("#modes").onclick=e=>{const b=e.target.closest("button");if(!b)return;const m=b.dataset.m;
  if(MODES[m]){S.mode=m;setN(MODES[m]);if(m=="Futsal")S.field="quadra";else if(S.field=="quadra")S.field="campo";}
  else if(MODES[S.mode]){S.mode="Outro";}
  refresh();};
$("#mname").oninput=e=>{S.mode=e.target.value.trim()||"Outro";drawTxt();save(true);};
$("#mn").onchange=e=>{setN(+e.target.value);refresh();};
$("#forms").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.f=b.dataset.f;S.pos=layout(S.f);refresh();};
$("#addb").onclick=()=>{S.bench.push(blank(nextNum()));refresh();};
$("#bench").addEventListener("input",e=>{
  const r=e.target.closest(".bn");if(!r)return;const p=S.bench[r.dataset.i];
  if(e.target.classList.contains("bnum"))p.n=e.target.value;else p.name=e.target.value;
  drawTxt();save(true);
});
$("#bench").addEventListener("click",e=>{
  const r=e.target.closest(".bn");if(!r)return;const i=+r.dataset.i;
  if(e.target.closest(".swap"))S.arm=S.arm==i?-1:i;
  else if(e.target.closest(".rm")){S.bench.splice(i,1);S.arm=-1;}
  else return;
  refresh();
});
$("#clear").onclick=()=>{S.pl.forEach(p=>p.name="");S.bench.forEach(p=>p.name="");refresh();};
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("img"));i.src=src;});
const svgURL=s=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
$("#crestB").onclick=()=>$("#crestF").click();
$("#crestX").onclick=()=>{S.crest="";refresh();};
$("#crestF").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),h=$("#crestH");
  try{
    const im=await loadImg(url),w=im.naturalWidth||160,ht=im.naturalHeight||160,k=Math.min(1,160/Math.max(w,ht));
    const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(ht*k));
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    let d=cv.toDataURL("image/webp",.9);if(!d.startsWith("data:image/webp"))d=cv.toDataURL("image/png");
    S.crest=d;h.textContent="PNG com fundo transparente fica melhor.";refresh();
  }catch(_){h.textContent="Não deu para ler essa imagem. Envie um arquivo PNG, JPG ou SVG.";}
  finally{URL.revokeObjectURL(url);e.target.value="";}
};
async function clip(text,btn,ok){
  try{await navigator.clipboard.writeText(text);}catch(e){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");}catch(_){}t.remove();}
  const o=btn.textContent;btn.textContent=ok;setTimeout(()=>btn.textContent=o,1600);
}
$("#copy").onclick=e=>clip($("#txt").value,e.target,"Texto copiado");
$("#link").onclick=e=>{const u=location.origin+location.pathname+"#e="+enc();try{history.replaceState(null,"","#e="+enc());}catch(_){}clip(u,e.target,"Link copiado");};
$("#svSave").onclick=()=>{
  let a=[];try{a=JSON.parse(localStorage.getItem(SAVED)||"[]");}catch(e){}
  const name=`${S.team||"Meu time"} · ${S.mode} ${S.f}`,i=a.findIndex(s=>s.name==name),d={name,data:pick(S)};
  if(i>=0)a[i]=d;else a.push(d);
  try{localStorage.setItem(SAVED,JSON.stringify(a));}catch(e){}
  drawSaved();$("#sv").value=i>=0?i:a.length-1;
};
$("#svOpen").onclick=()=>{
  try{const a=JSON.parse(localStorage.getItem(SAVED)||"[]"),s=a[+$("#sv").value];
    if(s&&valid(s.data)){apply(s.data);syncInputs();refresh();}}catch(e){}
};
$("#svDel").onclick=()=>{
  try{const a=JSON.parse(localStorage.getItem(SAVED)||"[]");a.splice(+$("#sv").value,1);localStorage.setItem(SAVED,JSON.stringify(a));}catch(e){}
  drawSaved();
};

/* ---------- imagem para baixar ---------- */
$("#png").onclick=async e=>{
  const btn=e.currentTarget;btn.disabled=true;
  try{
  try{await Promise.all([document.fonts.load('700 50px "Barlow Condensed"'),document.fonts.load('600 28px Barlow')]);}catch(_){}
  const W=1080,H=1600,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  const px=90,py=180,pw=900,ph=Math.round(pw*100/68);
  const [fieldImg,crestImg,...shirts]=await Promise.all([
    loadImg(svgURL(fieldSVG(S.field))),
    S.crest?loadImg(S.crest).catch(()=>null):Promise.resolve(null),
    ...S.pl.map((p,i)=>{const k=kitOf(i);return loadImg(svgURL(shirtSVG(k.b,k.c,k.p,null,"x"+i)));})
  ]);
  c.fillStyle="#0f1613";c.fillRect(0,0,W,H);
  let tx=px;
  if(crestImg){const s=120,k=Math.min(s/crestImg.width,s/crestImg.height);c.drawImage(crestImg,px,30+(s-crestImg.height*k)/2,crestImg.width*k,crestImg.height*k);tx=px+s+24;}
  const fit=(t,m)=>{if(c.measureText(t).width<=m)return t;while(t.length>1&&c.measureText(t+"…").width>m)t=t.slice(0,-1);return t.trim()+"…";};
  c.fillStyle="#fff";c.textAlign="left";c.font='700 72px "Barlow Condensed",Arial Narrow,sans-serif';c.fillText(fit(S.team||"Meu time",W-px-tx),tx,104);
  c.fillStyle="#9fb2a6";c.font='600 30px Barlow,Arial,sans-serif';c.fillText(`${S.mode} · ${S.f}`,tx,146);
  c.save();c.beginPath();if(c.roundRect)c.roundRect(px,py,pw,ph,16);else c.rect(px,py,pw,ph);c.clip();
  c.drawImage(fieldImg,px,py,pw,ph);
  if(crestImg){const s=pw*.24,k=Math.min(s/crestImg.width,s/crestImg.height);c.globalAlpha=.28;c.drawImage(crestImg,px+pw/2-crestImg.width*k/2,py+ph/2-crestImg.height*k/2,crestImg.width*k,crestImg.height*k);c.globalAlpha=1;}
  c.restore();
  const pts=S.pl.map((p,i)=>[px+S.pos[i][0]/100*pw,py+S.pos[i][1]/100*ph]);
  const room=i=>{let m=320;pts.forEach((q,j)=>{if(j!=i&&Math.abs(q[1]-pts[i][1])<110)m=Math.min(m,Math.abs(q[0]-pts[i][0])-16);});return Math.max(120,m);};
  const wrap=(t,m)=>{const w=t.split(/\s+/).filter(Boolean),L=[];let cur="";
    for(const x of w){const tr=cur?cur+" "+x:x;if(c.measureText(tr).width<=m||!cur)cur=tr;else{L.push(cur);cur=x;}}
    if(cur)L.push(cur);if(L.length>2)L.splice(1,L.length,L.slice(1).join(" "));return L.map(l=>fit(l,m));};
  c.lineJoin="round";
  S.pl.forEach((p,i)=>{
    const [x,y]=pts[i],k=kitOf(i),sz=128;
    c.save();c.shadowColor="rgba(0,0,0,.45)";c.shadowBlur=8;c.shadowOffsetY=4;c.drawImage(shirts[i],x-sz/2,y-sz/2,sz,sz);c.restore();
    c.textAlign="center";c.textBaseline="middle";c.font='700 48px "Barlow Condensed",Arial Narrow,sans-serif';
    const ny=y+sz*.12;
    if(k.p!="liso"){c.lineWidth=7;c.strokeStyle="rgba(0,0,0,.7)";c.strokeText(p.n,x,ny);c.fillStyle="#fff";}else c.fillStyle=ink(k.b);
    c.fillText(p.n,x,ny);
    const ro=S.pos[i][2];
    if(ro){c.font='700 22px Barlow,Arial,sans-serif';const w=c.measureText(ro).width+16,bx=x+48,by=y-56;
      c.fillStyle="#14211a";c.beginPath();if(c.roundRect)c.roundRect(bx-w/2,by-15,w,30,15);else c.rect(bx-w/2,by-15,w,30);c.fill();
      c.lineWidth=2;c.strokeStyle="rgba(255,255,255,.7)";c.stroke();c.fillStyle="#fff";c.fillText(ro,bx,by+1);}
    if(p.name){c.font='600 30px Barlow,Arial,sans-serif';
      wrap(p.name,room(i)).forEach((t,j)=>{const ty=y+sz/2+12+j*32;c.lineWidth=6;c.strokeStyle="rgba(0,0,0,.6)";c.strokeText(t,x,ty);c.fillStyle="#fff";c.fillText(t,x,ty);});}
  });
  c.textAlign="left";c.textBaseline="alphabetic";c.fillStyle="#cfd8d2";c.font='600 28px Barlow,Arial,sans-serif';
  const bn=S.bench.filter(p=>p.name||p.n).map(p=>`${p.n} ${p.name}`.trim()).join("  ·  ");
  if(bn)c.fillText(fit("Reservas: "+bn,pw),px,py+ph+56);
  await new Promise(res=>cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(S.team||"escalacao").replace(/[^\w-]+/g,"-")+".png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);res();},"image/png"));
  }finally{btn.disabled=false;}
};

/* ---------- arrastar e teclado ---------- */
function tap(i){
  if(S.arm>=0){const t=S.pl[i];S.pl[i]=S.bench[S.arm];S.bench[S.arm]=t;S.arm=-1;S.sel=i;}
  else S.sel=S.sel==i?-1:i;
  refresh();
}
let drag=null;
pitch.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".tok");if(!t)return;
  try{t.setPointerCapture(e.pointerId);}catch(_){}
  drag={t,i:+t.dataset.i,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};
});
pitch.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!=drag.id)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  drag.moved=true;drag.t.classList.add("drag");
  const r=pitch.getBoundingClientRect();
  const x=Math.min(95,Math.max(5,(e.clientX-r.left)/r.width*100)),y=Math.min(96,Math.max(4,(e.clientY-r.top)/r.height*100));
  S.pos[drag.i][0]=x;S.pos[drag.i][1]=y;drag.t.style.left=x+"%";drag.t.style.top=y+"%";
});
pitch.addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!=drag.id)return;
  const d=drag;drag=null;
  if(d.moved){d.t.classList.remove("drag");save();}else tap(d.i);
});
pitch.addEventListener("pointercancel",()=>{if(drag){drag.t.classList.remove("drag");drag=null;}});
function foc(i){const t=pitch.querySelector(`.tok[data-i="${i}"]`);if(t)t.focus();}
pitch.addEventListener("keydown",e=>{
  const t=e.target.closest(".tok");if(!t)return;const i=+t.dataset.i;
  if(e.key=="Enter"||e.key==" "){e.preventDefault();tap(i);foc(i);return;}
  const m={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];
  if(m){e.preventDefault();S.pos[i][0]=Math.min(95,Math.max(5,S.pos[i][0]+m[0]));S.pos[i][1]=Math.min(96,Math.max(4,S.pos[i][1]+m[1]));drawPitch();save();foc(i);}
});
$("#undo").onclick=undo;$("#redo").onclick=redo;
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey)||e.target.matches("input,textarea"))return;
  const k=e.key.toLowerCase();
  if(k=="z"&&!e.shiftKey){e.preventDefault();undo();}
  else if(k=="y"||(k=="z"&&e.shiftKey)){e.preventDefault();redo();}
});
drawSaved();refresh();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
