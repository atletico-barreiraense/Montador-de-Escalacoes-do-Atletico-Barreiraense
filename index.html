<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montador de escalações</title>
<meta name="theme-color" content="#2e6b46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--ink:#14211a;--panel:#fff;--line:#cdd6cf;--mut:#5b6b61;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1613;--ink:#e6ece8;--panel:#17211c;--line:#2b3a32;--mut:#93a499}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1613;--ink:#e6ece8;--panel:#17211c;--line:#2b3a32;--mut:#93a499}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
.app{max-width:1040px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.app{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}.stick{position:sticky;top:16px}}
.pitch{position:relative;aspect-ratio:68/100;border-radius:10px;border:2px solid #1f4a30;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:repeating-linear-gradient(180deg,#2e6b46 0 10%,#33764d 10% 20%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);width:15%;min-width:44px;max-width:64px;text-align:center;cursor:grab;touch-action:none;outline:none}
.tok.drag{cursor:grabbing;z-index:5}
.dot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 clamp(17px,4.6vw,24px)/1 "Barlow Condensed",Barlow,sans-serif;border:2px solid rgba(255,255,255,.92);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.nm{margin:3px auto 0;font:600 11px/1.15 Barlow,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);max-width:78px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.rl{position:absolute;top:-6px;right:-8px;background:#14211a;color:#fff;font:700 10px/1 Barlow,sans-serif;padding:3px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.7)}
.tok.sel .dot{outline:3px solid #fff;outline-offset:2px}
.tok:focus-visible .dot{outline:3px solid #ffd84d;outline-offset:2px}
.pitch.swap .tok .dot{outline:2px dashed #fff;outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:18px}
h1{margin:0;font:700 34px/1 "Barlow Condensed",Barlow,sans-serif}
h2{margin:0 0 6px;font:700 19px/1.2 "Barlow Condensed",Barlow,sans-serif}
label{display:grid;gap:4px;font-weight:600;font-size:14px;color:var(--mut)}
input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
.row2{display:grid;grid-template-columns:1fr 110px;gap:10px}
.chips,.acts{display:flex;flex-wrap:wrap;gap:6px}
button{font:600 14px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button.pri{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2f8f5b;outline-offset:1px}
.hint{margin:0;color:var(--mut);font-size:14px}
.ed{display:grid;grid-template-columns:64px 1fr 96px;gap:10px}
.bn{display:grid;grid-template-columns:52px 1fr auto auto;gap:6px;margin-bottom:6px;align-items:center}
.cu{display:grid;grid-template-columns:1fr 130px;gap:10px;margin-top:10px}
textarea{width:100%;font:14px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
</style>
</head>
<body>
<main class="app">
  <div class="stick">
    <div class="pitch" id="pitch">
      <svg viewBox="0 0 68 100" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.78)" stroke-width=".45" aria-hidden="true">
        <rect x="3" y="3" width="62" height="94"/><path d="M3 50h62"/><circle cx="34" cy="50" r="8.5"/>
        <rect x="13.5" y="3" width="41" height="16"/><rect x="24.5" y="3" width="19" height="6"/>
        <rect x="13.5" y="81" width="41" height="16"/><rect x="24.5" y="91" width="19" height="6"/>
      </svg>
    </div>
    <div class="acts" style="margin-top:8px;align-items:center"><button id="undo" disabled>Desfazer</button><button id="redo" disabled>Refazer</button></div>
    <p class="hint" style="margin-top:8px">Arraste os jogadores para mover. Toque para editar nome, número e função.</p>
  </div>
  <section class="panel">
    <h1>Montador de escalações</h1>
    <div class="row2">
      <label>Nome do time<input type="text" id="team" maxlength="30"></label>
      <label>Cor da camisa<input type="color" id="color"></label>
    </div>
    <div>
      <h2>Modalidade</h2><div class="chips" id="modes"></div>
      <div class="cu" id="custom" hidden>
        <label>Nome da modalidade<input type="text" id="mname" maxlength="20"></label>
        <label>Em campo<select id="mn"></select></label>
      </div>
    </div>
    <div><h2>Formação</h2><div class="chips" id="forms"></div></div>
    <div><h2>Jogador selecionado</h2><div id="ed"></div></div>
    <div><h2>Banco de reservas</h2><div id="bench"></div><button id="addb">Adicionar reserva</button></div>
    <div>
      <h2>Compartilhar</h2>
      <div class="acts"><button class="pri" id="png">Baixar imagem</button><button id="link">Copiar link</button><button id="copy">Copiar texto</button><button id="clear">Limpar nomes</button></div>
      <textarea id="txt" rows="9" readonly style="margin-top:10px"></textarea>
    </div>
    <div>
      <h2>Escalações salvas</h2>
      <div class="acts"><select id="sv" style="flex:1;min-width:150px"></select><button id="svSave">Salvar atual</button><button id="svOpen">Abrir</button><button id="svDel">Excluir</button></div>
    </div>
  </section>
</main>
<script>
const MODES={"Futebol 11":11,"Futsal":5,"Fut7":7};
const PRE=["4-4-2","4-3-3","4-2-3-1","3-5-2","3-4-3","5-3-2","4-1-4-1"];
const ROLES=["","GOL","ZAG","LD","LE","VOL","MEI","ME","MD","PE","PD","ATA","FIX","ALA","PIV"];
const $=s=>document.querySelector(s),KEY="escalacao-v2",SAVED="escalacoes-salvas-v2";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRESETS={5:["1-2-1","2-2","3-1","1-3"],7:["3-2-1","2-3-1","3-3","2-2-2","3-1-2","2-1-2-1"]};
function formsFor(n){
  if(n==11)return PRE;if(PRESETS[n])return PRESETS[n];const m=n-1;if(m<1)return[];
  const o=[];if(m<=5)o.push([m]);
  for(let a=1;a<=m;a++)for(let b=1;a+b<=m;b++){const c=m-a-b,r=c?[a,b,c]:[a,b];
    if(Math.max(...r)-Math.min(...r)<=2&&Math.max(...r)<=5)o.push(r);}
  const ideal=m<=3?1:m<=5?2:3,sc=r=>(Math.max(...r)-Math.min(...r))+Math.abs(r.length-ideal)*1.5+(r[0]<r[r.length-1]?.5:0);
  o.sort((x,y)=>sc(x)-sc(y));
  return o.slice(0,8).map(r=>r.join("-"));
}
function layout(f){
  const fs=f.split("-").reduce((a,b)=>a+ +b,0)==4;
  const rows=f.split("-").map(Number),n=rows.length,o=[[50,89,"GOL"]];
  rows.forEach((c,r)=>{const y=n==1?42:70-56*r/(n-1),sp=c<=2?36:c==3?54:c==4?68:76;
    for(let i=0;i<c;i++){
      const edge=c>=3&&(i==0||i==c-1),left=i==0;let ro;
      if(n==1||r==n-1&&n>1)ro=(c==3&&edge)?(left?"PE":"PD"):"ATA";
      if(r==0&&n>1)ro=(c>=4&&edge)?(left?"LE":"LD"):"ZAG";
      if(r>0&&r<n-1)ro=(r==1&&n>=3&&c<=2)?"VOL":(c>=4&&edge?(left?"ME":"MD"):"MEI");
      if(fs){ro=r==n-1&&n>1&&c==1?"PIV":r==0&&c==1?"FIX":"ALA";if(n==1)ro=c==1?"PIV":"ALA";}
      o.push([c==1?50:50-sp/2+sp*i/(c-1),y,ro]);}});
  return o;
}
const blank=n=>({n:String(n),name:""});
let S={team:"Meu time",color:"#c8102e",mode:"Futebol 11",n:11,f:"4-3-3",pl:[],bench:[],pos:[],sel:-1,arm:-1};
S.pl=Array.from({length:11},(_,i)=>blank(i+1));
S.bench=Array.from({length:7},(_,i)=>blank(i+12));
S.pos=layout(S.f);
function valid(d){return d&&d.pl&&d.bench&&d.pos&&d.n>=2&&d.n<=11&&d.pl.length==d.n&&d.pos.length==d.n&&typeof d.f=="string"&&d.f.split("-").reduce((a,b)=>a+(+b||0),0)==d.n-1;}
const pick=d=>({team:d.team,color:d.color,mode:d.mode,n:d.n,f:d.f,pl:d.pl,bench:d.bench,pos:d.pos});
function apply(d){Object.assign(S,pick(d),{sel:-1,arm:-1});}
try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(valid(d))apply(d);}catch(e){}
const enc=()=>encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(pick(S))))));
try{if(location.hash.startsWith("#e=")){const d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(3))))));if(valid(d))apply(d);}}catch(e){}
let H=[],hi=-1,lastT=0,restoring=false;
function updUndo(){$("#undo").disabled=hi<=0;$("#redo").disabled=hi>=H.length-1;}
function save(){
  const j=JSON.stringify(pick(S));try{localStorage.setItem(KEY,j);}catch(e){}
  if(restoring||H[hi]===j)return;
  const now=Date.now();
  if(hi>0&&now-lastT<700)H[hi]=j;else{H=H.slice(0,hi+1);H.push(j);hi++;if(H.length>100){H.shift();hi--;}}
  lastT=now;updUndo();
}
function restore(){restoring=true;apply(JSON.parse(H[hi]));$("#team").value=S.team;$("#color").value=S.color;refresh();restoring=false;lastT=0;updUndo();}
function undo(){if(hi>0){hi--;restore();}}
function redo(){if(hi<H.length-1){hi++;restore();}}
function ink(h){const v=parseInt(h.slice(1),16);return(.299*(v>>16)+.587*((v>>8)&255)+.114*(v&255))>150?"#14211a":"#fff";}
function nextNum(){const u=new Set([...S.pl,...S.bench].map(p=>p.n));let i=1;while(u.has(String(i)))i++;return String(i);}
function setN(n){
  while(S.pl.length>n)S.bench.unshift(S.pl.pop());
  while(S.pl.length<n)S.pl.push(S.bench.length?S.bench.shift():blank(nextNum()));
  S.n=n;const fs=formsFor(n);if(!fs.includes(S.f))S.f=n==11?"4-3-3":fs[0]||"";
  S.pos=layout(S.f);S.sel=-1;S.arm=-1;
}
const pitch=$("#pitch");
function drawPitch(){
  pitch.querySelectorAll(".tok").forEach(e=>e.remove());
  pitch.classList.toggle("swap",S.arm>=0);
  S.pl.forEach((p,i)=>{
    const gk=i==0,bg=gk?"#f2c230":S.color,fg=gk?"#1a1a1a":ink(S.color),r=S.pos[i][2];
    const t=document.createElement("div");
    t.className="tok"+(S.sel==i?" sel":"");t.dataset.i=i;t.tabIndex=0;t.setAttribute("role","button");
    t.setAttribute("aria-label","Jogador "+p.n+" "+p.name+" "+r);
    t.style.left=S.pos[i][0]+"%";t.style.top=S.pos[i][1]+"%";
    t.innerHTML=`<div class="dot" style="background:${bg};color:${fg}">${esc(p.n)}</div>${r?`<span class="rl">${r}</span>`:""}<div class="nm">${esc(p.name)}</div>`;
    pitch.appendChild(t);
  });
}
function drawModes(){
  const cust=!MODES[S.mode];
  $("#modes").innerHTML=Object.keys(MODES).map(m=>`<button data-m="${m}" aria-pressed="${S.mode==m}">${m}</button>`).join("")+`<button data-m="Outro" aria-pressed="${cust}">Outro</button>`;
  $("#custom").hidden=!cust;$("#mname").value=cust?S.mode:"";
  $("#mn").innerHTML=Array.from({length:10},(_,i)=>`<option value="${i+2}"${S.n==i+2?" selected":""}>${i+2} jogadores</option>`).join("");
  $("#forms").innerHTML=formsFor(S.n).map(f=>`<button data-f="${f}" aria-pressed="${f==S.f}">${f}</button>`).join("");
}
function drawEd(){
  const e=$("#ed");
  if(S.sel<0){e.innerHTML='<p class="hint">Nenhum jogador selecionado.</p>';return;}
  const p=S.pl[S.sel];
  e.innerHTML=`<div class="ed"><label>Número<input type="text" id="en" maxlength="2" inputmode="numeric" value="${esc(p.n)}"></label><label>Nome<input type="text" id="ename" maxlength="22" value="${esc(p.name)}"></label><label>Função<select id="er">${ROLES.map(r=>`<option value="${r}"${S.pos[S.sel][2]==r?" selected":""}>${r||"—"}</option>`).join("")}</select></label></div>`;
  $("#en").oninput=ev=>{S.pl[S.sel].n=ev.target.value;refresh(false);};
  $("#ename").oninput=ev=>{S.pl[S.sel].name=ev.target.value;refresh(false);};
  $("#er").onchange=ev=>{S.pos[S.sel][2]=ev.target.value;refresh(false);};
}
function drawBench(){
  $("#bench").innerHTML=S.bench.map((p,i)=>`<div class="bn" data-i="${i}"><input type="text" class="bnum" maxlength="2" inputmode="numeric" value="${esc(p.n)}" aria-label="Número do reserva ${i+1}"><input type="text" class="bname" maxlength="22" placeholder="Reserva ${i+1}" value="${esc(p.name)}"><button class="swap" aria-pressed="${S.arm==i}">Trocar</button><button class="rm" aria-label="Remover reserva ${i+1}">✕</button></div>`).join("")
    +(S.arm>=0?'<p class="hint">Toque num titular no campo para fazer a troca.</p>':"")
    +(!S.bench.length?'<p class="hint">Sem reservas.</p>':"");
}
function lines(){const l=(p,r)=>`${(p.n||"").padStart(2," ")}  ${p.name||"—"}${r?"  ("+r+")":""}`;
  return `${S.team||"Meu time"} · ${S.mode} ${S.f}\n\n`+S.pl.map((p,i)=>l(p,S.pos[i][2])).join("\n")+(S.bench.length?"\n\nReservas\n"+S.bench.map(p=>l(p)).join("\n"):"");}
function drawTxt(){$("#txt").value=lines();}
function drawSaved(){
  let a=[];try{a=JSON.parse(localStorage.getItem(SAVED)||"[]");}catch(e){}
  $("#sv").innerHTML=a.length?a.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join(""):'<option value="">Nenhuma salva</option>';
}
function refresh(full=true){drawPitch();drawTxt();save();if(full){drawModes();drawEd();drawBench();}}
$("#team").value=S.team;$("#color").value=S.color;
$("#team").oninput=e=>{S.team=e.target.value;drawTxt();save();};
$("#color").oninput=e=>{S.color=e.target.value;drawPitch();save();};
$("#modes").onclick=e=>{const b=e.target.closest("button");if(!b)return;const m=b.dataset.m;
  if(MODES[m]){S.mode=m;setN(MODES[m]);}else if(MODES[S.mode]){S.mode="Outro";}
  refresh();};
$("#mname").oninput=e=>{S.mode=e.target.value.trim()||"Outro";drawTxt();save();};
$("#mn").onchange=e=>{setN(+e.target.value);refresh();};
$("#forms").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.f=b.dataset.f;S.pos=layout(S.f);refresh();};
$("#addb").onclick=()=>{S.bench.push(blank(nextNum()));refresh();};
$("#bench").addEventListener("input",e=>{
  const r=e.target.closest(".bn");if(!r)return;const p=S.bench[r.dataset.i];
  if(e.target.classList.contains("bnum"))p.n=e.target.value;else p.name=e.target.value;
  drawTxt();save();
});
$("#bench").addEventListener("click",e=>{
  const r=e.target.closest(".bn");if(!r)return;const i=+r.dataset.i;
  if(e.target.closest(".swap"))S.arm=S.arm==i?-1:i;
  else if(e.target.closest(".rm")){S.bench.splice(i,1);S.arm=-1;}
  else return;
  refresh();
});
$("#clear").onclick=()=>{S.pl.forEach(p=>p.name="");S.bench.forEach(p=>p.name="");refresh();};
async function clip(text,btn,ok){
  try{await navigator.clipboard.writeText(text);}catch(e){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");}catch(_){}t.remove();}
  const o=btn.textContent;btn.textContent=ok;setTimeout(()=>btn.textContent=o,1600);
}
$("#copy").onclick=e=>clip($("#txt").value,e.target,"Texto copiado");
$("#link").onclick=e=>{const u=location.origin+location.pathname+"#e="+enc();try{history.replaceState(null,"","#e="+enc());}catch(_){}clip(u,e.target,"Link copiado");};
$("#svSave").onclick=()=>{
  let a=[];try{a=JSON.parse(localStorage.getItem(SAVED)||"[]");}catch(e){}
  const name=`${S.team||"Meu time"} · ${S.mode} ${S.f}`,i=a.findIndex(s=>s.name==name),d={name,data:pick(S)};
  if(i>=0)a[i]=d;else a.push(d);
  try{localStorage.setItem(SAVED,JSON.stringify(a));}catch(e){}
  drawSaved();$("#sv").value=i>=0?i:a.length-1;
};
$("#svOpen").onclick=()=>{
  try{const a=JSON.parse(localStorage.getItem(SAVED)||"[]"),s=a[+$("#sv").value];
    if(s&&valid(s.data)){apply(s.data);$("#team").value=S.team;$("#color").value=S.color;refresh();}}catch(e){}
};
$("#svDel").onclick=()=>{
  try{const a=JSON.parse(localStorage.getItem(SAVED)||"[]");a.splice(+$("#sv").value,1);localStorage.setItem(SAVED,JSON.stringify(a));}catch(e){}
  drawSaved();
};
$("#png").onclick=async()=>{
  try{await Promise.all([document.fonts.load('700 50px "Barlow Condensed"'),document.fonts.load('600 28px Barlow')]);}catch(e){}
  const W=1080,H=1600,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  const px=90,py=160,pw=900,ph=Math.round(pw*100/68),sx=pw/68,sy=ph/100;
  c.fillStyle="#0f1613";c.fillRect(0,0,W,H);
  c.fillStyle="#fff";c.textAlign="left";c.font='700 70px "Barlow Condensed",Arial Narrow,sans-serif';c.fillText(S.team||"Meu time",px,100);
  c.fillStyle="#9fb2a6";c.font='600 30px Barlow,Arial,sans-serif';c.fillText(`${S.mode} · ${S.f}`,px,142);
  for(let i=0;i<10;i++){c.fillStyle=i%2?"#33764d":"#2e6b46";c.fillRect(px,py+i*ph/10,pw,ph/10);}
  c.strokeStyle="rgba(255,255,255,.8)";c.lineWidth=4;
  const R=(x,y,w,h)=>c.strokeRect(px+x*sx,py+y*sy,w*sx,h*sy);
  R(3,3,62,94);R(13.5,3,41,16);R(24.5,3,19,6);R(13.5,81,41,16);R(24.5,91,19,6);
  c.beginPath();c.moveTo(px+3*sx,py+50*sy);c.lineTo(px+65*sx,py+50*sy);c.stroke();
  c.beginPath();c.arc(px+34*sx,py+50*sy,8.5*sx,0,7);c.stroke();
  const fit=(t,m)=>{if(c.measureText(t).width<=m)return t;while(t.length>1&&c.measureText(t+"…").width>m)t=t.slice(0,-1);return t.trim()+"…";};
  const pts=S.pl.map((p,i)=>[px+S.pos[i][0]/100*pw,py+S.pos[i][1]/100*ph]);
  const room=i=>{let m=320;pts.forEach((q,j)=>{if(j!=i&&Math.abs(q[1]-pts[i][1])<110)m=Math.min(m,Math.abs(q[0]-pts[i][0])-16);});return Math.max(120,m);};
  const wrap=(t,m)=>{const w=t.split(/\s+/).filter(Boolean),L=[];let cur="";
    for(const x of w){const tr=cur?cur+" "+x:x;if(c.measureText(tr).width<=m||!cur)cur=tr;else{L.push(cur);cur=x;}}
    if(cur)L.push(cur);if(L.length>2)L.splice(1,L.length,L.slice(1).join(" "));return L.map(l=>fit(l,m));};
  c.lineJoin="round";
  S.pl.forEach((p,i)=>{
    const x=px+S.pos[i][0]/100*pw,y=py+S.pos[i][1]/100*ph,gk=i==0,r=54;
    c.fillStyle=gk?"#f2c230":S.color;c.beginPath();c.arc(x,y,r,0,7);c.fill();
    c.lineWidth=5;c.strokeStyle="#fff";c.stroke();
    c.fillStyle=gk?"#1a1a1a":ink(S.color);c.textAlign="center";c.textBaseline="middle";
    c.font='700 54px "Barlow Condensed",Arial Narrow,sans-serif';c.fillText(p.n,x,y+2);
    const ro=S.pos[i][2];
    if(ro){c.font='700 22px Barlow,Arial,sans-serif';const w=c.measureText(ro).width+16;
      c.fillStyle="#14211a";c.beginPath();if(c.roundRect)c.roundRect(x+r-w/2-4,y-r-6,w,30,15);else c.rect(x+r-w/2-4,y-r-6,w,30);c.fill();c.fillStyle="#fff";c.fillText(ro,x+r-4,y-r+10);}
    if(p.name){c.font='600 30px Barlow,Arial,sans-serif';
      wrap(p.name,room(i)).forEach((t,k)=>{const ty=y+r+26+k*32;c.lineWidth=6;c.strokeStyle="rgba(0,0,0,.55)";c.strokeText(t,x,ty);c.fillStyle="#fff";c.fillText(t,x,ty);});}
  });
  c.textAlign="left";c.textBaseline="alphabetic";c.fillStyle="#cfd8d2";c.font='600 28px Barlow,Arial,sans-serif';
  const bn=S.bench.filter(p=>p.name||p.n).map(p=>`${p.n} ${p.name}`.trim()).join("  ·  ");
  if(bn)c.fillText(fit("Reservas: "+bn,pw),px,py+ph+60);
  cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(S.team||"escalacao").replace(/[^\w-]+/g,"-")+".png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},"image/png");
};
function tap(i){
  if(S.arm>=0){const t=S.pl[i];S.pl[i]=S.bench[S.arm];S.bench[S.arm]=t;S.arm=-1;S.sel=i;}
  else S.sel=S.sel==i?-1:i;
  refresh();
}
let drag=null;
pitch.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".tok");if(!t)return;
  t.setPointerCapture(e.pointerId);
  drag={t,i:+t.dataset.i,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};
});
pitch.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!=drag.id)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  drag.moved=true;drag.t.classList.add("drag");
  const r=pitch.getBoundingClientRect();
  const x=Math.min(95,Math.max(5,(e.clientX-r.left)/r.width*100)),y=Math.min(96,Math.max(4,(e.clientY-r.top)/r.height*100));
  S.pos[drag.i][0]=x;S.pos[drag.i][1]=y;drag.t.style.left=x+"%";drag.t.style.top=y+"%";
});
pitch.addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!=drag.id)return;
  const d=drag;drag=null;
  if(d.moved){d.t.classList.remove("drag");save();}else tap(d.i);
});
pitch.addEventListener("pointercancel",()=>{if(drag){drag.t.classList.remove("drag");drag=null;}});
function foc(i){const t=pitch.querySelector(`.tok[data-i="${i}"]`);if(t)t.focus();}
pitch.addEventListener("keydown",e=>{
  const t=e.target.closest(".tok");if(!t)return;const i=+t.dataset.i;
  if(e.key=="Enter"||e.key==" "){e.preventDefault();tap(i);foc(i);return;}
  const m={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];
  if(m){e.preventDefault();S.pos[i][0]=Math.min(95,Math.max(5,S.pos[i][0]+m[0]));S.pos[i][1]=Math.min(96,Math.max(4,S.pos[i][1]+m[1]));drawPitch();save();foc(i);}
});
$("#undo").onclick=undo;$("#redo").onclick=redo;
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey)||e.target.matches("input,textarea"))return;
  const k=e.key.toLowerCase();
  if(k=="z"&&!e.shiftKey){e.preventDefault();undo();}
  else if(k=="y"||(k=="z"&&e.shiftKey)){e.preventDefault();redo();}
});
drawSaved();refresh();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
